# Ficha do projeto: nome, versão do Python, bibliotecas e configuração das ferramentas.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "leitor_certificados"
dynamic = ["version"]  # vem de src/leitor_certificados/__init__.py (__version__)
description = "IA (machine learning) que lê certificados de calibração em PDF e confere com o plano"
requires-python = ">=3.12"
# As bibliotecas entram etapa por etapa (PDF, OCR, scikit-learn), cada uma com o porquê.
dependencies = [
    "reportlab>=4.0",   # etapa 1: escreve os PDFs digitais dos certificados fictícios
    "pypdfium2>=4.0",   # etapa 1: transforma PDF em imagem (para o "escaneado") e lê o texto
    "pillow>=10.0",     # etapa 1: "suja" a imagem (giro, ruído, desfoque, JPEG) como um scanner
    "rapidocr>=3.0",    # etapa 2: OCR local (lê o texto da imagem do escaneado)
    "onnxruntime>=1.18",  # etapa 2: roda os modelos do OCR neste computador, sem internet
    "scikit-learn>=1.5",  # etapa 3: o modelo de machine learning que aprende o que cada palavra é
    "numpy>=2.0",       # etapa 2: a imagem vira uma tabela de números para o OCR
]

[project.optional-dependencies]
# Ferramentas só de desenvolvimento
dev = [
    "pytest>=8.0",      # testes automáticos
    "ruff>=0.6",        # verificação de estilo e erros
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "leitor_certificados.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F = erros básicos, I = ordem dos imports, B = armadilhas comuns, UP = sintaxe moderna
select = ["E", "F", "I", "B", "UP"]
